# تشغيل مُعين كاملاً (إنتاج محلي / VPS): قاعدة + Redis + خلفية + واجهة.
# الاستخدام:  docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: moeen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moeen_prod}
      POSTGRES_DB: moeen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moeen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://moeen:${POSTGRES_PASSWORD:-moeen_prod}@postgres:5432/moeen
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3001"

volumes:
  pgdata:
  redisdata:
